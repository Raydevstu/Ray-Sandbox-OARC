services:
  app:
    build: .
    ports:
      - "3029:3000"
    environment:
      NODE_ENV: production
      APEX_DATABASE_URL: ${APEX_DATABASE_URL:?set APEX_DATABASE_URL}
      APEX_JWT_ISSUER: ${APEX_JWT_ISSUER:?set APEX_JWT_ISSUER}
      APEX_JWKS_URL: ${APEX_JWKS_URL:?set APEX_JWKS_URL}
      APEX_REQUIRE_JWT: "true"
      APEX_ALLOW_DEV_PRINCIPAL: "false"
      APEX_AUDIT_TENANT_ID: ${APEX_AUDIT_TENANT_ID:?set APEX_AUDIT_TENANT_ID}
      APEX_AUDIT_BANK_ID: ${APEX_AUDIT_BANK_ID:?set APEX_AUDIT_BANK_ID}
      APEX_AUDIT_PROJECT_ID: ${APEX_AUDIT_PROJECT_ID:?set APEX_AUDIT_PROJECT_ID}
