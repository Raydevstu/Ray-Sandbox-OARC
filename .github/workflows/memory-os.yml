name: Memory OS Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-memory-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run edge spool tests
        run: python -m unittest discover services/memory-os -v
